name: Verify all sorting and DAA programs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile and test both collections
        run: make test
      - name: Check memory access and undefined behaviour
        run: make sanitize
